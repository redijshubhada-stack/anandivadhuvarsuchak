<script>
function toggleMenu(){
    document.querySelector(".menu-section").classList.toggle("active");
}

function toggleMobileFilter(){
    const filter = document.getElementById("mobileFilterContent");
    const arrow = document.getElementById("filterArrow");

    filter.classList.toggle("active");

    arrow.innerHTML = filter.classList.contains("active")
        ? '<i class="fa fa-chevron-up"></i>'
        : '<i class="fa fa-chevron-down"></i>';
}

function sendWhatsApp(reg, name){
    var phone = "917558319213";

    var message =
        "आनंदी वधुवर सूचक\n\n" +
        "मला खालील प्रोफाईलची माहिती हवी आहे:\n" +
        "नोंदणी क्रमांक: " + reg + "\n" +
        "नाव: " + name;

    var url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);
    window.open(url, "_blank");
}

function normalizeHeight(value){
    if(!value) return "";

    let h = value.toString().toLowerCase().trim();

    h = h.replace("feet", "")
         .replace("foot", "")
         .replace("ft", "")
         .replace("f", "")
         .replace("inch", "")
         .replace("inches", "")
         .replace("'", ".")
         .replace("’", ".")
         .replace('"', "")
         .replace(/\s+/g, "");

    if(h.includes(".")){
        let parts = h.split(".");
        return parts[0] + "." + parts[1];
    }

    return h;
}

function getBirthYear(item){
    if(item.birthyear) return item.birthyear;
    if(item.birthYear) return item.birthYear;
    if(item.dob){
        const d = new Date(item.dob);
        return isNaN(d.getTime()) ? "" : d.getFullYear();
    }
    if(item.dateofbirth){
        const d = new Date(item.dateofbirth);
        return isNaN(d.getTime()) ? "" : d.getFullYear();
    }
    return "";
}

function getPhotoUrl(item){

    let photo = item.photo || item.Photo || item.cloudinaryUrl || item.cloudinaryurl || item.profilepic || item.profilepicpath || "";

    if(!photo){
        return "images/no-photo.jpg";
    }

    photo = photo.toString().trim();

    if(photo.includes("res.cloudinary.com")){
        return photo.replace(
            "/image/upload/",
            "/image/upload/f_auto,q_auto,c_fill,w_350,h_450/"
        );
    }

    if(photo.includes("googleusercontent.com")){
        return photo;
    }

    let fileId = item.photoId || "";

    if(!fileId){
        if(photo.includes("id=")){
            fileId = photo.split("id=")[1].split("&")[0];
        }
        else if(photo.includes("/d/")){
            fileId = photo.split("/d/")[1].split("/")[0];
        }
        else{
            let match = photo.match(/[-\w]{25,}/);
            if(match){
                fileId = match[0];
            }
        }
    }

    if(fileId){
        return "https://lh3.googleusercontent.com/d/" + fileId + "=w350";
    }

    return photo;
}

function resetFilter(){
    document.getElementById("edu").value = "";
    document.getElementById("caste").value = "";
    document.getElementById("height").value = "";
    applyFilters();
}

function resetMobileFilter(){
    document.getElementById("mobileEdu").value = "";
    document.getElementById("mobileCaste").value = "";
    document.getElementById("mobileHeight").value = "";
    applyFilters();
}

// GOOGLE SHEET DATA
fetch("./profiles.json")
.then(res => res.json())
.then(data => {

    let html = "";

    data.forEach(item => {

       const profile = (item.profile || item.Profile || "").toString();
    const remarriage = (item.remarriage || "").toString().trim().toLowerCase();

    if(
        (profile.includes("Bride") ||
         profile.includes("bride") ||
         profile.includes("वधू"))
        &&
        remarriage !== "yes"
    ){

            const arn = item.arn || "";
            const name = item.name || "";
            const education = item.education || "";
            const height = item.height || "";
            const caste = item.caste || "";
            const birthyear = getBirthYear(item);
            const photo = getPhotoUrl(item);

            html += `
                <div class="profile-card"
                    data-edu="${education}"
                    data-caste="${caste}"
                    data-height="${normalizeHeight(height)}">

                   <img src="${photo}"  alt="${name}" loading="lazy"
     decoding="async"
     referrerpolicy="no-referrer"
     onerror="this.onerror=null; this.src='images/no-photo.jpg';">
                    <div class="card-body">
                        <h6 style="color:#b71c3b;font-weight:600;">${arn}</h6>

                        <h4 style="margin-top:10px;color:black;font-weight:600;">
                            ${name}
                        </h4>

                        <p><b>Education:</b> ${education}</p>
                        <p><b>Height:</b> ${height}</p>
                        <p><b>Caste:</b> ${caste}</p>
                    <p><b>Birth Year:</b> ${birthyear}</p>

                        <button class="btn btn-success mt-2"
                            onclick="sendWhatsApp('${arn}','${name}')">
                            WhatsApp
                        </button>
                    </div>
                </div>
            `;
        }
    });

    document.getElementById("profiles").innerHTML = html;

    setupFilters();
})
.catch(error => {
    console.error("Data loading error:", error);
});

function setupFilters(){
    ["edu", "caste", "height", "mobileEdu", "mobileCaste", "mobileHeight"].forEach(id => {
        const el = document.getElementById(id);

        if(el){
            el.addEventListener("change", function(){
                applyFilters();

                if(id.startsWith("mobile")){
                    const filter = document.getElementById("mobileFilterContent");
                    const arrow = document.getElementById("filterArrow");

                    filter.classList.remove("active");

                    if(arrow){
                        arrow.innerHTML = '<i class="fa fa-chevron-down"></i>';
                    }
                }
            });
        }
    });
}

function applyFilters(){

    const edu = document.getElementById("edu")?.value || document.getElementById("mobileEdu")?.value || "";
    const caste = document.getElementById("caste")?.value || document.getElementById("mobileCaste")?.value || "";
    const height = document.getElementById("height")?.value || document.getElementById("mobileHeight")?.value || "";

    document.querySelectorAll(".profile-card").forEach(card => {

        const cardEdu = (card.dataset.edu || "").toLowerCase();
        const cardCaste = (card.dataset.caste || "").toLowerCase();
        const cardHeight = card.dataset.height || "";

        let show = true;

        if(edu && !cardEdu.includes(edu.toLowerCase())) show = false;
        if(caste && !cardCaste.includes(caste.toLowerCase())) show = false;
        if(height && cardHeight !== height) show = false;

        card.style.display = show ? "block" : "none";
    });
}
